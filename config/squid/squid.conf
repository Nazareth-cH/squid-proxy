http_port 3128

#cache_dir ufs /var/cache/squid 1000 16 256
cache deny all
maximum_object_size 50 MB

acl localnet src 192.168.0.0/16
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 127.0.0.0/8

acl workhours time MTWHF 09:00-18:00
acl block_domains dstdomain "/etc/squid/blocked_domains.txt"
acl block_ext url_regex -i \.exe$ \.msi$ \.scr$ \.bat$ \.com$
acl safe_ports port 80 443

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm Squid Proxy
auth_param basic credentialsttl 2 hours
acl authenticated proxy_auth REQUIRED

http_access deny !safe_ports
http_access deny block_domains
http_access deny block_ext
#http_access allow authenticated workhours
http_access allow authenticated
http_access deny all

access_log stdio:/dev/stdout squid
cache_log /dev/stdout
cache_effective_user squid
cache_effective_group squid

refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320

pid_filename none
